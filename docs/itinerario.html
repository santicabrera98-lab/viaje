<style>
/* Layout: app a pantalla completa. Columna izquierda = cuaderno de viaje con un capítulo por día; derecha = mapa de Google. En móvil el mapa va arriba y los días debajo. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f7fa;
  --ink: #16213a; --ink-2: #5a6480; --line: #d9dee8;
  --accent: #1f4fd8; --accent-ink: #ffffff;
  --ok: #138a4c; --ok-bg: #e2f5ea; --bad: #c0392b;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* color por ciudad (marcadores, cintas de los días) */
  --c-mendoza: #7a7f8c; --c-madrid: #c8102e; --c-valencia: #e8862a; --c-roma: #7b3fa0;
  --c-cordoba: #c9a227; --c-sevilla: #2a9d8f; --c-barcelona: #1f4fd8; --c-ruta: #5a6480;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #171d2c; --surface-2: #1d2436; --ink: #e8ecf4; --ink-2: #a3acc2; --line: #2b3449;
    --accent: #7c9cff; --accent-ink: #0f1420; --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a7a;
    --c-mendoza: #9aa0ae; --c-madrid: #ff6b7f; --c-valencia: #ffa552; --c-roma: #c08ce6; --c-cordoba: #e6c454; --c-sevilla: #5fd0c2; --c-barcelona: #7c9cff; --c-ruta: #a3acc2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #171d2c; --surface-2: #1d2436; --ink: #e8ecf4; --ink-2: #a3acc2; --line: #2b3449;
  --accent: #7c9cff; --accent-ink: #0f1420; --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a7a;
  --c-mendoza: #9aa0ae; --c-madrid: #ff6b7f; --c-valencia: #ffa552; --c-roma: #c08ce6; --c-cordoba: #e6c454; --c-sevilla: #5fd0c2; --c-barcelona: #7c9cff; --c-ruta: #a3acc2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; }
header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
header.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
header.top .sub { color: var(--ink-2); font-size: 12.5px; }
header.top .sp { flex: 1; }
.btn { font: inherit; font-size: 12.5px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; display: grid; grid-template-columns: 420px minmax(0, 1fr); min-height: 0; width: 100%; }
aside { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
#map { min-height: 0; min-width: 0; width: 100%; height: 100%; background: #dfe6ee; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
  aside { border-right: 0; border-top: 1px solid var(--line); order: 2; }
  #map { order: 1; }
}
.dia { flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.dia.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.dia .cab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; border-left: 5px solid var(--cc, var(--c-ruta)); }
.dia .cab .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); min-width: 26px; }
.dia .cab .fecha { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.1; }
.dia .cab .fecha small { font-family: var(--font-body); font-size: 11.5px; color: var(--ink-2); display: block; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.dia .cab .ciudad { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--cc, var(--ink-2)); text-align: right; }
.dia .cuerpo { display: none; padding: 4px 12px 12px; border-top: 1px dashed var(--line); }
.dia.sel .cuerpo { display: grid; gap: 10px; }
.campo { display: grid; gap: 3px; }
.campo label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); font-weight: 600; }
.campo input, .campo textarea, .campo select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.campo textarea { min-height: 56px; resize: vertical; }
.fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lugares { display: grid; gap: 4px; }
.lugar { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; background: var(--surface-2); }
.lugar .pin { width: 20px; height: 20px; border-radius: 50%; background: var(--cc); color: #fff; font-family: var(--font-mono); font-size: 10.5px; display: grid; place-items: center; }
.lugar input { font: inherit; font-size: 13px; background: transparent; border: 0; border-bottom: 1px solid transparent; color: var(--ink); width: 100%; padding: 2px 0; }
.lugar input:hover, .lugar input:focus { border-bottom-color: var(--line); }
.lugar .acc { display: flex; gap: 2px; }
.ico { font: inherit; font-size: 12px; background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.ico:hover { background: var(--line); color: var(--ink); }
.ico.del:hover { color: var(--bad); }
select.ico { max-width: 82px; font-size: 11px; border: 1px solid var(--line); background: var(--surface); }
.buscar { position: relative; }
.buscar input { font: inherit; font-size: 13px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.sug { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; }
.sug button { display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 9px; cursor: pointer; color: var(--ink); }
.sug button:hover { background: var(--surface-2); }
.acciones { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--ink-2); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1000; }
.toast.on { opacity: 1; }
/* marcadores */
.mk { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--cc); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center; }
.mk span { transform: rotate(45deg); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.mk.dim { opacity: .35; }
.mk.base { width: 32px; height: 32px; }
.leaflet-popup-content { font-family: var(--font-body); font-size: 13px; margin: 10px 12px; }
.leaflet-popup-content b { font-family: var(--font-display); font-size: 14px; }
.leaflet-popup-content a { color: var(--accent); }
.leaflet-container { font-family: var(--font-body); }
#map.modo-agregar { cursor: crosshair; }
.modo { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

function cargar() {
  try { const s = localStorage.getItem(KEY); if (s) { const p = JSON.parse(s); if (p && p.dias) return p; } } catch (e) {}

}
function guardar(msg = "Guardado en este navegador") {
  try { localStorage.setItem(KEY, JSON.stringify(plan)); toast(msg); } catch (e) { toast("No se pudo guardar (almacenamiento bloqueado)"); }
}

const colorCiudad = c => { const k = (c || "").toLowerCase().normalize("NFD").replace(/[^a-z]/g, ""); return ["mendoza","madrid","valencia","roma","cordoba","sevilla","barcelona"].includes(k) ? `var(--c-${k})` : "var(--c-ruta)"; };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtFecha(iso) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return { dia: DIAS[dt.getUTCDay()], corta: `${d} ${MESES[m - 1]}` }; }

// ---------- Mapa (Google Maps como base, vía Leaflet) ----------
const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([40.5, 2.5], 5);
L.tileLayer("https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=es", { maxZoom: 20, subdomains: ["mt0", "mt1", "mt2", "mt3"], attribution: "Mapa © Google" }).addTo(map);
const capa = L.layerGroup().addTo(map), capaRuta = L.layerGroup().addTo(map);
map.on("click", e => {
  if (!modoAgregar) return;
  plan.dias[sel].lugares.push({ nombre: "Nuevo lugar", lat: +e.latlng.lat.toFixed(5), lng: +e.latlng.lng.toFixed(5) });
  modoAgregar = false; document.getElementById("map").classList.remove("modo-agregar");
  guardar("Lugar agregado"); render(false);
});
function gmaps(l) { return `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`; }
function gmapsRuta(d) { const pts = d.lugares.map(l => `${l.lat},${l.lng}`); return pts.length > 1 ? `https://www.google.com/maps/dir/${pts.join("/")}` : null; }
function dibujarMapa(ajustar) {
  capa.clearLayers(); capaRuta.clearLayers();
  const ptsRuta = [];
  plan.dias.forEach((d, i) => {
    const cc = colorCiudad(d.ciudad);
    d.lugares.forEach((l, j) => {
      const icon = L.divIcon({ className: "", html: `<div class="mk ${i === sel ? "base" : "dim"}" style="--cc:${cc}"><span>${i === sel ? j + 1 : ""}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
      const m = L.marker([l.lat, l.lng], { icon, draggable: i === sel, zIndexOffset: i === sel ? 1000 : 0 }).addTo(capa);
      const f = fmtFecha(d.fecha);
      m.bindPopup(`<b>${esc(l.nombre)}</b><br><span style="color:var(--ink-2)">${f.dia} ${f.corta} · ${esc(d.ciudad)}</span><br><a href="${gmaps(l)}" target="_blank" rel="noopener">Abrir en Google Maps</a>`);
      m.on("click", () => { if (i !== sel) { sel = i; render(true); } });
      m.on("dragend", ev => { const p = ev.target.getLatLng(); l.lat = +p.lat.toFixed(5); l.lng = +p.lng.toFixed(5); guardar("Posición actualizada"); dibujarMapa(false); });
    });
    if (d.lugares.length) ptsRuta.push(d.lugares[d.lugares.length - 1]);
  });
  // ruta general del viaje: une el último lugar de cada día
  const seq = ptsRuta.map(p => [p.lat, p.lng]);
  if (seq.length > 1) L.polyline(seq, { color: "#16213a", weight: 2, opacity: .45, dashArray: "6 6" }).addTo(capaRuta);
  const d = plan.dias[sel];
  if (d.lugares.length > 1) L.polyline(d.lugares.map(l => [l.lat, l.lng]), { color: "#1f4fd8", weight: 3, opacity: .9 }).addTo(capaRuta);
  if (ajustar && d.lugares.length) {
    const b = L.latLngBounds(d.lugares.map(l => [l.lat, l.lng]));
    map.fitBounds(b.pad(0.35), { maxZoom: 14, animate: true });
  }
}
function verTodo() {
  const todos = plan.dias.flatMap(d => d.lugares).filter(l => l.lat > 20); // Europa (deja afuera Mendoza/Santiago para que el mapa sea útil)
  if (todos.length) map.fitBounds(L.latLngBounds(todos.map(l => [l.lat, l.lng])).pad(0.1));
}

// ---------- Panel de días ----------
function render(ajustar = true) {
  const cont = document.getElementById("dias");
  cont.innerHTML = plan.dias.map((d, i) => {
    const f = fmtFecha(d.fecha), cc = colorCiudad(d.ciudad), s = i === sel;
    const opcionesDia = plan.dias.map((x, k) => `<option value="${k}" ${k === i ? "selected" : ""}>${k === i ? "mover a…" : fmtFecha(x.fecha).corta + " · " + esc(x.ciudad)}</option>`).join("");
    const lugares = d.lugares.map((l, j) => `<div class="lugar" style="--cc:${cc}"><span class="pin">${j + 1}</span>
        <input data-i="${i}" data-j="${j}" data-f="nombre" value="${esc(l.nombre)}" aria-label="Nombre del lugar">
        <span class="acc"><button class="ico" title="Subir" data-act="up" data-i="${i}" data-j="${j}">▲</button><button class="ico" title="Bajar" data-act="down" data-i="${i}" data-j="${j}">▼</button>
        <select class="ico" title="Mover a otro día" data-act="mover" data-i="${i}" data-j="${j}" aria-label="Mover a otro día">${opcionesDia}</select>
        <a class="ico" href="${gmaps(l)}" target="_blank" rel="noopener" title="Abrir en Google Maps">↗</a>
        <button class="ico del" title="Quitar" data-act="del" data-i="${i}" data-j="${j}">✕</button></span></div>`).join("");
    const ruta = gmapsRuta(d);
    return `<section class="dia ${s ? "sel" : ""}" style="--cc:${cc}" id="d${i}">
      <div class="cab" data-sel="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span>
        <div class="fecha">${f.corta}<small>${f.dia}</small></div>
        <div class="ciudad">${esc(d.ciudad)}<br><span style="color:var(--ink-2);font-weight:400">${esc(d.titulo)}</span></div></div>
      <div class="cuerpo">
        <div class="fila2">
          <div class="campo"><label for="t${i}">Título del día</label><input id="t${i}" data-i="${i}" data-f="titulo" value="${esc(d.titulo)}"></div>
          <div class="campo"><label for="c${i}">Ciudad base</label><input id="c${i}" data-i="${i}" data-f="ciudad" value="${esc(d.ciudad)}" list="ciudades"></div>
        </div>
        <div class="campo"><label for="s${i}">Dónde dormimos</label><input id="s${i}" data-i="${i}" data-f="dormir" value="${esc(d.dormir)}"></div>
        <div class="campo"><label for="r${i}">Traslado</label><input id="r${i}" data-i="${i}" data-f="traslado" value="${esc(d.traslado)}"></div>
        <div class="campo"><label for="n${i}">Plan y notas</label><textarea id="n${i}" data-i="${i}" data-f="notas">${esc(d.notas)}</textarea></div>
        <div class="campo"><label>Lugares del día (arrastrá los pines en el mapa para ajustarlos)</label><div class="lugares">${lugares || '<span class="hint">Sin lugares todavía.</span>'}</div></div>
        <div class="buscar"><input id="b${i}" placeholder="Agregar lugar: escribí y elegí (ej. Trastevere, Roma)" autocomplete="off" data-buscar="${i}"><div class="sug" id="sug${i}" hidden></div></div>
        <div class="acciones">
          <button class="btn ${modoAgregar ? "modo" : ""}" data-act="modo">${modoAgregar ? "Tocá el mapa para ubicar el lugar…" : "Agregar tocando el mapa"}</button>
          ${ruta ? `<a class="btn" href="${ruta}" target="_blank" rel="noopener">Ruta del día en Google Maps</a>` : ""}
          <button class="btn" data-act="addDia" data-i="${i}">Agregar día después</button>
          ${plan.dias.length > 1 ? `<button class="btn danger" data-act="delDia" data-i="${i}">Eliminar este día</button>` : ""}
        </div>
      </div></section>`;
  }).join("") + `<datalist id="ciudades">${["Madrid","Valencia","Roma","Córdoba","Sevilla","Barcelona","Mendoza","En ruta"].map(c => `<option value="${c}">`).join("")}</datalist>`;
  dibujarMapa(ajustar);
  if (ajustar) { const el = document.getElementById("d" + sel); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

// ---------- Eventos (delegados) ----------
const cont = document.getElementById("dias");
cont.addEventListener("click", e => {
  const cab = e.target.closest(".cab"); if (cab) { sel = +cab.dataset.sel; render(true); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const i = +b.dataset.i, j = +b.dataset.j, d = plan.dias[sel];
  switch (b.dataset.act) {
    case "del": d.lugares.splice(j, 1); guardar("Lugar quitado"); render(false); break;
    case "up": if (j > 0) { [d.lugares[j - 1], d.lugares[j]] = [d.lugares[j], d.lugares[j - 1]]; guardar(); render(false); } break;
    case "down": if (j < d.lugares.length - 1) { [d.lugares[j + 1], d.lugares[j]] = [d.lugares[j], d.lugares[j + 1]]; guardar(); render(false); } break;
    case "modo": modoAgregar = !modoAgregar; document.getElementById("map").classList.toggle("modo-agregar", modoAgregar); render(false); break;
    case "addDia": { const base = plan.dias[i]; const dt = new Date(base.fecha + "T00:00:00Z"); dt.setUTCDate(dt.getUTCDate() + 1);
      plan.dias.splice(i + 1, 0, { fecha: dt.toISOString().slice(0, 10), ciudad: base.ciudad, titulo: "Nuevo día", dormir: base.dormir, traslado: "", notas: "", lugares: [] });
      sel = i + 1; guardar("Día agregado (revisá las fechas siguientes)"); render(true); break; }
    case "delDia": plan.dias.splice(i, 1); sel = Math.max(0, Math.min(sel, plan.dias.length - 1)); guardar("Día eliminado"); render(true); break;
  }
});
cont.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "mover") { const i = +el.dataset.i, j = +el.dataset.j, k = +el.value; if (k !== i) { const [l] = plan.dias[i].lugares.splice(j, 1); plan.dias[k].lugares.push(l); guardar("Lugar movido"); render(false); } return; }
  if (el.dataset.f !== undefined) {
    const i = +el.dataset.i, f = el.dataset.f;
    if (el.dataset.j !== undefined) plan.dias[i].lugares[+el.dataset.j][f] = el.value; else plan.dias[i][f] = el.value;
    guardar(); if (f === "ciudad" || f === "nombre" || f === "titulo") render(false);
  }
});
cont.addEventListener("input", e => { const el = e.target; if (el.dataset.f !== undefined && el.dataset.j === undefined) { plan.dias[+el.dataset.i][el.dataset.f] = el.value; } });
// búsqueda de lugares (OpenStreetMap Nominatim; los resultados se ubican sobre el mapa de Google)
let bT;
cont.addEventListener("input", e => {
  const el = e.target; if (el.dataset.buscar === undefined) return;
  const i = +el.dataset.buscar, box = document.getElementById("sug" + i), q = el.value.trim();
  clearTimeout(bT); if (q.length < 3) { box.hidden = true; return; }
  bT = setTimeout(async () => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=es&q=${encodeURIComponent(q)}`);
      const res = await r.json();
      box.innerHTML = res.length ? res.map(x => `<button data-lat="${x.lat}" data-lng="${x.lon}" data-nombre="${esc(x.display_name.split(",")[0])}">${esc(x.display_name)}</button>`).join("") : `<button disabled>Sin resultados</button>`;
      box.hidden = false;
    } catch (err) { box.innerHTML = `<button disabled>No se pudo buscar</button>`; box.hidden = false; }
  }, 400);
});
cont.addEventListener("click", e => {
  const b = e.target.closest(".sug button[data-lat]"); if (!b) return;
  plan.dias[sel].lugares.push({ nombre: b.dataset.nombre, lat: +(+b.dataset.lat).toFixed(5), lng: +(+b.dataset.lng).toFixed(5) });
  guardar("Lugar agregado"); render(true);
});
document.addEventListener("click", e => { if (!e.target.closest(".buscar")) document.querySelectorAll(".sug").forEach(s => s.hidden = true); });

// ---------- Barra superior ----------
document.getElementById("verTodo").onclick = verTodo;
document.getElementById("exportar").onclick = () => {
  const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "itinerario-espana-2027.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById("importar").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const p = JSON.parse(await f.text()); if (!p.dias) throw new Error(); plan = p; sel = 0; guardar("Itinerario importado"); render(true); }
  catch (err) { toast("El archivo no es un itinerario válido"); }
  e.target.value = "";
};
document.getElementById("reset").onclick = () => {
  const b = document.getElementById("reset");
  if (b.dataset.confirm) { plan = JSON.parse(JSON.stringify(PLAN_BASE)); sel = 0; delete b.dataset.confirm; b.textContent = "Restablecer plan base"; guardar("Plan base restablecido"); render(true); }
  else { b.dataset.confirm = "1"; b.textContent = "¿Seguro? Tocá de nuevo para borrar tus cambios"; setTimeout(() => { delete b.dataset.confirm; b.textContent = "Restablecer plan base"; }, 4000); }
};

plan = cargar();
render(false);
verTodo();
window.addEventListener("resize", () => map.invalidateSize());
setTimeout(() => { map.invalidateSize(); verTodo(); }, 300);
</script>
</body>
</html>
