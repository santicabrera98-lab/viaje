<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerario España 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: mapa a pantalla completa; sobre él flotan una barra superior y un panel lateral de vidrio (estilo Apple Maps). En móvil el panel es una hoja inferior. */
:root {
  --glass: rgba(255,255,255,.78); --glass-strong: rgba(255,255,255,.92); --glass-border: rgba(255,255,255,.6);
  --card: #ffffff; --card-2: #f2f2f7; --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.2);
  --ink: #1c1c1e; --ink-2: #6e6e73; --ink-3: #aeaeb2; --line: rgba(60,60,67,.12);
  --blue: #007aff; --green: #34c759; --orange: #ff9500; --purple: #af52de; --red: #ff3b30; --teal: #30b0c7; --indigo: #5856d6; --yellow: #ffcc00; --gray: #8e8e93;
  --shadow: 0 10px 30px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
  --shadow-sm: 0 2px 10px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --r: 18px; --r-sm: 12px;
  --bg: #e5e9ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass: rgba(28,28,30,.76); --glass-strong: rgba(28,28,30,.92); --glass-border: rgba(255,255,255,.1);
    --card: #2c2c2e; --card-2: #1c1c1e; --fill: rgba(120,120,128,.24); --fill-2: rgba(120,120,128,.36);
    --ink: #f5f5f7; --ink-2: #98989d; --ink-3: #636366; --line: rgba(84,84,88,.6);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --purple: #bf5af2; --red: #ff453a; --teal: #40c8e0; --indigo: #5e5ce6; --yellow: #ffd60a; --gray: #8e8e93;
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
    --bg: #1c1c1e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --glass: rgba(28,28,30,.76); --glass-strong: rgba(28,28,30,.92); --glass-border: rgba(255,255,255,.1);
  --card: #2c2c2e; --card-2: #1c1c1e; --fill: rgba(120,120,128,.24); --fill-2: rgba(120,120,128,.36);
  --ink: #f5f5f7; --ink-2: #98989d; --ink-3: #636366; --line: rgba(84,84,88,.6);
  --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --purple: #bf5af2; --red: #ff453a; --teal: #40c8e0; --indigo: #5e5ce6; --yellow: #ffd60a; --gray: #8e8e93;
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
  --bg: #1c1c1e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--font); }
.leaflet-control-zoom { border: 0 !important; border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow-sm) !important; }
.leaflet-control-zoom a { background: var(--glass-strong) !important; color: var(--ink) !important; border: 0 !important; backdrop-filter: blur(20px); width: 36px !important; height: 36px !important; line-height: 36px !important; font-weight: 500; }
.leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top, 0px) + 76px); right: 14px; }
.leaflet-control-attribution { background: var(--glass) !important; color: var(--ink-2) !important; backdrop-filter: blur(10px); border-radius: 8px 0 0 0; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }

/* barra superior flotante */
.top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 14px; right: 14px; z-index: 900; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid var(--glass-border); border-radius: 999px; padding: 8px 16px 8px 10px; box-shadow: var(--shadow-sm); }
.brand .dot { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--purple)); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
.brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.brand small { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 400; }
.sp { flex: 1; }
.seg { display: flex; background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid var(--glass-border); border-radius: 999px; padding: 3px; box-shadow: var(--shadow-sm); gap: 2px; }
.seg button { font: inherit; font-size: 12.5px; font-weight: 500; border: 0; background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.seg button:hover { background: var(--fill); }
.seg button.on { background: var(--card); box-shadow: var(--shadow-sm); }
.seg button.danger { color: var(--red); }
.seg label { font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg label:hover { background: var(--fill); }

/* panel lateral de vidrio */
.panel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 84px); left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 400px; max-width: calc(100vw - 28px); z-index: 800; background: var(--glass); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border: 1px solid var(--glass-border); border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.panel .ph { padding: 14px 16px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel .ph h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.panel .ph span { color: var(--ink-2); font-size: 12.5px; }
.lista { overflow-y: auto; padding: 4px 10px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overscroll-behavior: contain; }
.lista::-webkit-scrollbar { width: 6px; } .lista::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 3px; }
@media (max-width: 760px) {
  .top { gap: 6px; } .brand small { display: none; } .seg button, .seg label { padding: 6px 9px; font-size: 12px; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: 100%; height: 52vh; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 8px auto 0; }
  .leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top, 0px) + 66px); }
}

/* tarjetas de día */
.dia { flex-shrink: 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
.dia .cab { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; user-select: none; }
.dia .cab:hover { background: var(--fill); }
.dia .fe { width: 44px; height: 44px; border-radius: 12px; background: var(--cc); color: #fff; display: grid; place-items: center; line-height: 1; flex-shrink: 0; }
.dia .fe b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.dia .fe small { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .9; margin-top: 2px; }
.dia .tx { min-width: 0; flex: 1; }
.dia .tx .t { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dia .tx .s { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dia .chev { color: var(--ink-3); font-size: 18px; transition: transform .2s ease; }
.dia.sel { box-shadow: 0 0 0 2px var(--blue), var(--shadow-sm); }
.dia.sel .chev { transform: rotate(90deg); }
.dia .cuerpo { display: none; padding: 2px 14px 14px; }
.dia.sel .cuerpo { display: grid; gap: 10px; animation: in .22s ease; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.grupo { background: var(--card-2); border-radius: var(--r-sm); overflow: hidden; }
.grupo .fila { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.grupo .fila:last-child { border-bottom: 0; }
.grupo label { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.grupo input, .grupo textarea { font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 0; width: 100%; padding: 2px 0; min-width: 0; }
.grupo textarea { resize: vertical; min-height: 44px; }
.grupo input:focus, .grupo textarea:focus, .buscar input:focus { outline: none; }
.grupo .fila:focus-within { background: var(--fill); }
.eyebrow { font-size: 11.5px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; padding: 2px 4px 0; }
.lugares { display: grid; gap: 6px; }
.lugar { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--card-2); }
.lugar .pin { width: 24px; height: 24px; border-radius: 50%; background: var(--cc); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.lugar input { font: inherit; font-size: 13.5px; background: transparent; border: 0; color: var(--ink); width: 100%; padding: 2px 0; min-width: 0; }
.lugar .acc { display: flex; gap: 2px; align-items: center; }
.ico { font: inherit; font-size: 13px; background: none; border: 0; color: var(--ink-2); cursor: pointer; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; text-decoration: none; }
.ico:hover { background: var(--fill-2); color: var(--ink); }
.ico.del:hover { color: var(--red); }
select.ico { width: auto; max-width: 88px; font-size: 11.5px; padding: 0 4px; background: var(--card); border: 1px solid var(--line); }
.buscar { position: relative; }
.buscar input { font: inherit; font-size: 13.5px; width: 100%; padding: 9px 12px 9px 34px; border: 0; border-radius: var(--r-sm); background: var(--card-2); color: var(--ink); }
.buscar::before { content: ""; position: absolute; left: 12px; top: 50%; width: 11px; height: 11px; margin-top: -7px; border: 2px solid var(--ink-3); border-radius: 50%; }
.buscar::after { content: ""; position: absolute; left: 22px; top: 50%; width: 6px; height: 2px; background: var(--ink-3); transform: rotate(45deg); margin-top: 3px; }
.sug { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--glass-strong); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--r-sm); box-shadow: var(--shadow); max-height: 220px; overflow-y: auto; }
.sug button { display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 12px; cursor: pointer; color: var(--ink); }
.sug button:last-child { border-bottom: 0; } .sug button:hover { background: var(--fill); }
.acciones { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 12.5px; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 13px; cursor: pointer; background: var(--fill); color: var(--blue); text-decoration: none; }
.btn:hover { background: var(--fill-2); }
.btn.primary { background: var(--blue); color: #fff; }
.btn.on { background: var(--green); color: #fff; }
.btn.danger { color: var(--red); }
.hint { font-size: 12px; color: var(--ink-2); padding: 0 4px; }
.toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 72px); left: 50%; transform: translateX(-50%) translateY(-6px); background: var(--glass-strong); backdrop-filter: blur(20px); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 1000; box-shadow: var(--shadow); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
/* marcadores estilo Apple Maps */
.mk { width: 26px; height: 26px; border-radius: 50%; background: var(--cc); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; font-family: var(--font); transition: transform .15s ease; }
.mk.dim { width: 14px; height: 14px; border-width: 2px; opacity: .8; }
.mk.base { width: 30px; height: 30px; }
.mk:hover { transform: scale(1.12); }
.leaflet-popup-content-wrapper { border-radius: 14px; background: var(--glass-strong); backdrop-filter: blur(20px); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-tip { background: var(--glass-strong); }
.leaflet-popup-content { margin: 10px 14px; font-size: 13px; }
.leaflet-popup-content b { font-size: 14px; font-weight: 600; }
.leaflet-popup-content a { color: var(--blue); text-decoration: none; font-weight: 500; }
.leaflet-popup-close-button { color: var(--ink-2) !important; }
#map.modo-agregar { cursor: crosshair; }
/* tarjetas de vuelo (estilo ficha de Google) */
.vuelo { background: var(--card-2); border-radius: var(--r-sm); overflow: hidden; }
.vuelo .vh { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
.vuelo .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--vc); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.vuelo .vh b { font-size: 14px; font-weight: 600; display: block; }
.vuelo .vh small { color: var(--ink-2); font-size: 12px; }
.vuelo .vh .sp { flex: 1; }
.estado { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--ink-2); white-space: nowrap; }
.estado.ok { background: rgba(52,199,89,.18); color: var(--green); }
.estado.warn { background: rgba(255,149,0,.18); color: var(--orange); }
.estado.bad { background: rgba(255,59,48,.18); color: var(--red); }
.estado.info { background: rgba(0,122,255,.14); color: var(--blue); }
.vuelo .vr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 4px 12px 10px; }
.vuelo .vt b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.vuelo .vt span { font-size: 13px; font-weight: 600; }
.vuelo .vt small { display: block; color: var(--ink-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vuelo .vt.r { text-align: right; }
.vuelo .vl { text-align: center; color: var(--ink-2); font-size: 11px; min-width: 70px; }
.vuelo .vl .line { height: 2px; background: var(--ink-3); border-radius: 1px; margin: 3px 0; position: relative; }
.vuelo .vl .line::after { content: "✈"; position: absolute; right: -4px; top: -9px; font-size: 11px; color: var(--ink-2); }
.vuelo .grupo { border-radius: 0; background: transparent; border-top: 1px solid var(--line); }
.vuelo .grupo .fila { grid-template-columns: 84px 1fr; padding: 6px 12px; }
.vuelo input::placeholder { text-transform: none; letter-spacing: 0; }
.vuelo .grupo select { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; width: 100%; }
.vuelo .vf { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 10px; border-top: 1px solid var(--line); }
.vuelo .vf .btn { padding: 6px 11px; font-size: 12px; }
.vuelo .nota { font-size: 11.5px; color: var(--ink-2); padding: 0 12px 8px; }
.ajustes { flex-shrink: 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 12px 14px; display: grid; gap: 8px; }
.ajustes h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.ajustes p { margin: 0; font-size: 12px; color: var(--ink-2); }
.ajustes input { font: inherit; font-size: 13px; color: var(--ink); background: var(--card-2); border: 0; border-radius: 10px; padding: 8px 10px; width: 100%; }
@media (prefers-reduced-motion: reduce) { .dia, .dia .chev, .toast, .mk { transition: none; } .dia.sel .cuerpo { animation: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="brand"><div class="dot">21</div><h1>España y Roma · feb 2027<small>21 días · todo se guarda en este navegador</small></h1></div>
  <span class="sp"></span>
  <div class="seg">
    <button id="verTodo">Todo el viaje</button>
    <button id="exportar">Exportar</button>
    <label for="importar">Importar</label><input type="file" id="importar" accept="application/json" hidden>
    <button id="reset" class="danger">Restablecer</button>
    <a href="index.html" style="font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--blue);text-decoration:none">Precios</a>
  </div>
</div>
<aside class="panel">
  <div class="ph"><h2>Itinerario</h2><span>tocá un día para abrirlo; tocalo otra vez para cerrarlo</span><span class="sp"></span><button class="btn" id="contraer" style="padding:4px 10px">Contraer</button></div>
  <div class="lista" id="dias"></div>
</aside>
<div class="toast" id="toast"></div>

<script>

const KEY = "itinerario_es2027_v2";
let plan, sel = 0, modoAgregar = false;
function cargar() {

let toastT;

// ---------- Mapa (Google Maps de base) ----------
const map = L.map("map", { zoomControl: true }).setView([40.5, 2.5], 5);
map.zoomControl.setPosition("topright");
L.tileLayer("https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=es", { maxZoom: 20, subdomains: ["mt0", "mt1", "mt2", "mt3"], attribution: "Mapa © Google" }).addTo(map);
const capa = L.layerGroup().addTo(map), capaRuta = L.layerGroup().addTo(map);
map.on("click", e => {
  if (!modoAgregar || sel < 0) return;
  plan.dias[sel].lugares.push({ nombre: "Nuevo lugar", lat: +e.latlng.lat.toFixed(5), lng: +e.latlng.lng.toFixed(5) });
  modoAgregar = false; document.getElementById("map").classList.remove("modo-agregar");
  guardar("Lugar agregado"); render(false);
});
function gmaps(l) { return `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`; }
function gmapsRuta(d) { const pts = d.lugares.map(l => `${l.lat},${l.lng}`); return pts.length > 1 ? `https://www.google.com/maps/dir/${pts.join("/")}` : null; }
function padding() { const w = window.innerWidth; return w > 760 ? { paddingTopLeft: [440, 100], paddingBottomRight: [30, 30] } : { paddingTopLeft: [20, 70], paddingBottomRight: [20, window.innerHeight * 0.52 + 20] }; }
function dibujarMapa(ajustar) {
  capa.clearLayers(); capaRuta.clearLayers();
  const ptsRuta = [];
  plan.dias.forEach((d, i) => {
    const cc = colorCiudad(d.ciudad);
    d.lugares.forEach((l, j) => {
      const s = i === sel;
      const icon = L.divIcon({ className: "", html: `<div class="mk ${s ? "base" : "dim"}" style="--cc:${cc}">${s ? j + 1 : ""}</div>`, iconSize: s ? [30, 30] : [14, 14], iconAnchor: s ? [15, 15] : [7, 7], popupAnchor: [0, -14] });
      const m = L.marker([l.lat, l.lng], { icon, draggable: s, zIndexOffset: s ? 1000 : 0 }).addTo(capa);
      const f = fmtFecha(d.fecha);
      m.bindPopup(`<b>${esc(l.nombre)}</b><br><span style="color:var(--ink-2)">${f.diaL} ${f.corta} · ${esc(d.ciudad)}</span><br><a href="${gmaps(l)}" target="_blank" rel="noopener">Abrir en Google Maps ↗</a>`);
      m.on("click", () => { if (i !== sel) { sel = i; render(true); } });
      m.on("dragend", ev => { const p = ev.target.getLatLng(); l.lat = +p.lat.toFixed(5); l.lng = +p.lng.toFixed(5); guardar("Pin movido"); dibujarMapa(false); });
    });
    if (d.lugares.length) ptsRuta.push(d.lugares[d.lugares.length - 1]);
  });
  const seq = ptsRuta.map(p => [p.lat, p.lng]);
  if (seq.length > 1) L.polyline(seq, { color: "#8e8e93", weight: 2, opacity: .6, dashArray: "4 8", lineCap: "round" }).addTo(capaRuta);
  const d = plan.dias[sel];
  if (!d) { if (ajustar) verTodo(); return; }
  if (d.lugares.length > 1) {
    const pts = d.lugares.map(l => [l.lat, l.lng]);
    L.polyline(pts, { color: "#ffffff", weight: 7, opacity: .9, lineJoin: "round", lineCap: "round" }).addTo(capaRuta);
    L.polyline(pts, { color: "#007aff", weight: 4, opacity: 1, lineJoin: "round", lineCap: "round" }).addTo(capaRuta);
  }
  if (ajustar && d.lugares.length) map.fitBounds(L.latLngBounds(d.lugares.map(l => [l.lat, l.lng])), { ...padding(), maxZoom: 14, animate: true });
}
function verTodo() {
  const todos = plan.dias.flatMap(d => d.lugares).filter(l => l.lat > 20);
  if (todos.length) map.fitBounds(L.latLngBounds(todos.map(l => [l.lat, l.lng])), padding());
}

function duracion(v) {
  if (!v.salida || !v.llegada) return "";
  const [h1, m1] = v.salida.split(":").map(Number), [h2, m2] = v.llegada.split(":").map(Number);
  let min = (h2 * 60 + m2) - (h1 * 60 + m1) + (v.llegadaDia || 0) * 1440; if (min < 0) min += 1440;
  return `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")}`;
}

function getKey() { try { return localStorage.getItem("aerodatabox_key") || ""; } catch (e) { return ""; } }
async function estadoVivo(idx) {
  const v = plan.vuelos[idx], key = getKey(); if (!key) return;

    const r = await fetch(`https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(v.numero)}/${v.fecha}?withAircraftImage=false&withLocation=false`, { headers: { "x-rapidapi-key": key, "x-rapidapi-host": "aerodatabox.p.rapidapi.com" } });
    if (r.status === 204 || r.status === 404) { v.live = "La aerolínea todavía no publicó este vuelo (suele aparecer unos días antes)."; v.estado = "desconocido"; }

    else {

        if (dep.revisedTime && hora(dep.revisedTime) !== v.salida) partes.push(`salida revisada ${hora(dep.revisedTime)}`);
        if (dep.gate) partes.push(`puerta ${dep.gate}`);
        if (arr.terminal) partes.push(`llega a T${String(arr.terminal).replace(/^T/i, "")}`);
        v.live = `Estado en vivo (${new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}): ${d.status || "sin estado"}${partes.length ? " · " + partes.join(" · ") : ""}`;
      }
    }
  } catch (e) { v.live = "No se pudo consultar el estado (sin conexión o clave inválida)."; }
  guardar("Estado actualizado"); render(false);
}

// ---------- Panel ----------
function render(ajustar = true) {
  const cont = document.getElementById("dias");
  cont.innerHTML = plan.dias.map((d, i) => {
    const f = fmtFecha(d.fecha), cc = colorCiudad(d.ciudad), s = i === sel;
    const opcionesDia = plan.dias.map((x, k) => `<option value="${k}" ${k === i ? "selected" : ""}>${k === i ? "mover a…" : fmtFecha(x.fecha).corta + " · " + esc(x.ciudad)}</option>`).join("");
    const lugares = d.lugares.map((l, j) => `<div class="lugar" style="--cc:${cc}"><span class="pin">${j + 1}</span>
        <input data-i="${i}" data-j="${j}" data-f="nombre" value="${esc(l.nombre)}" aria-label="Nombre del lugar">
        <span class="acc"><button class="ico" title="Subir" data-act="up" data-i="${i}" data-j="${j}">↑</button><button class="ico" title="Bajar" data-act="down" data-i="${i}" data-j="${j}">↓</button>
        <select class="ico" title="Mover a otro día" data-act="mover" data-i="${i}" data-j="${j}" aria-label="Mover a otro día">${opcionesDia}</select>
        <a class="ico" href="${gmaps(l)}" target="_blank" rel="noopener" title="Abrir en Google Maps">↗</a>
        <button class="ico del" title="Quitar" data-act="del" data-i="${i}" data-j="${j}">✕</button></span></div>`).join("");
    const ruta = gmapsRuta(d);
    return `<section class="dia ${s ? "sel" : ""}" style="--cc:${cc}" id="d${i}">
      <div class="cab" data-sel="${i}"><div class="fe"><b>${f.d}</b><small>${f.dia}</small></div>
        <div class="tx"><div class="t">${esc(d.titulo)}</div><div class="s">${esc(d.ciudad)} · ${esc(d.dormir)}</div></div><span class="chev">›</span></div>
      <div class="cuerpo">
        <div class="grupo">
          <div class="fila"><label for="t${i}">Título</label><input id="t${i}" data-i="${i}" data-f="titulo" value="${esc(d.titulo)}"></div>
          <div class="fila"><label for="c${i}">Ciudad</label><input id="c${i}" data-i="${i}" data-f="ciudad" value="${esc(d.ciudad)}" list="ciudades"></div>
          <div class="fila"><label for="s${i}">Dormimos en</label><input id="s${i}" data-i="${i}" data-f="dormir" value="${esc(d.dormir)}"></div>
          <div class="fila"><label for="r${i}">Traslado</label><input id="r${i}" data-i="${i}" data-f="traslado" value="${esc(d.traslado)}"></div>
          <div class="fila"><label for="n${i}">Notas</label><textarea id="n${i}" data-i="${i}" data-f="notas">${esc(d.notas)}</textarea></div>
        </div>
        ${(() => { const vs = plan.vuelos.map((v, k) => [v, k]).filter(([v]) => v.fecha === d.fecha); return vs.length ? `<div class="eyebrow">Vuelos</div>${vs.map(([v, k]) => tarjetaVuelo(v, k)).join("")}` : ""; })()}
        <div class="eyebrow">Lugares del día</div>
        <div class="lugares">${lugares || '<span class="hint">Sin lugares todavía. Buscá uno abajo o tocá el mapa.</span>'}</div>
        <div class="buscar"><input id="b${i}" placeholder="Buscar un lugar (ej. Trastevere, Roma)" autocomplete="off" data-buscar="${i}"><div class="sug" id="sug${i}" hidden></div></div>
        <div class="acciones">
          <button class="btn ${modoAgregar ? "on" : ""}" data-act="modo">${modoAgregar ? "Tocá el mapa…" : "Agregar tocando el mapa"}</button>
          ${ruta ? `<a class="btn" href="${ruta}" target="_blank" rel="noopener">Ruta en Google Maps</a>` : ""}
          <button class="btn" data-act="addVuelo" data-i="${i}">+ Vuelo</button>
          <button class="btn" data-act="addDia" data-i="${i}">+ Día después</button>
          ${plan.dias.length > 1 ? `<button class="btn danger" data-act="delDia" data-i="${i}">Eliminar día</button>` : ""}
        </div>
        <div class="hint">Arrastrá los pines en el mapa para ajustarlos.</div>
      </div></section>`;
  }).join("") + `<section class="ajustes"><h3>Estado de los vuelos en vivo</h3><p>Las tarjetas muestran el horario oficial y el estado que vos marques. Para que se actualicen solas (en horario, demorado, puerta), pegá una clave gratuita de <a href="https://rapidapi.com/aedbx-aedbx/api/aerodatabox" target="_blank" rel="noopener">AeroDataBox en RapidAPI</a>. Se guarda solo en este navegador.</p><input id="adbkey" value="${esc(getKey())}" placeholder="Clave de RapidAPI (opcional)" autocomplete="off" spellcheck="false"></section><datalist id="ciudades">${["Madrid", "Valencia", "Roma", "Barcelona", "Mendoza", "En ruta"].map(c => `<option value="${c}">`).join("")}</datalist>`;
  dibujarMapa(ajustar);
  if (ajustar && sel >= 0) { const el = document.getElementById("d" + sel); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

// ---------- Eventos ----------
const cont = document.getElementById("dias");
cont.addEventListener("click", e => {
  const cab = e.target.closest(".cab"); if (cab) { const k = +cab.dataset.sel; sel = (k === sel) ? -1 : k; if (sel === -1) { modoAgregar = false; document.getElementById("map").classList.remove("modo-agregar"); } render(true); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const i = +b.dataset.i, j = +b.dataset.j, d = plan.dias[sel];
  switch (b.dataset.act) {
    case "del": d.lugares.splice(j, 1); guardar("Lugar quitado"); render(false); break;
    case "up": if (j > 0) { [d.lugares[j - 1], d.lugares[j]] = [d.lugares[j], d.lugares[j - 1]]; guardar(); render(false); } break;
    case "down": if (j < d.lugares.length - 1) { [d.lugares[j + 1], d.lugares[j]] = [d.lugares[j], d.lugares[j + 1]]; guardar(); render(false); } break;
    case "modo": modoAgregar = !modoAgregar; document.getElementById("map").classList.toggle("modo-agregar", modoAgregar); render(false); break;
    case "addVuelo": { const d0 = plan.dias[i]; plan.vuelos.push({ id: "v" + Date.now(), fecha: d0.fecha, aerolinea: "Ryanair", numero: "", origen: "", origenNombre: "", destino: "", destinoNombre: "", salida: "", llegada: "", llegadaDia: 0, terminal: "", reserva: "", estado: "programado", comprado: false, nota: "" }); guardar("Vuelo agregado"); render(false); break; }
    case "delVuelo": plan.vuelos.splice(+b.dataset.v, 1); guardar("Vuelo quitado"); render(false); break;
    case "estadoVivo": estadoVivo(+b.dataset.v); break;
    case "addDia": { const base = plan.dias[i]; const dt = new Date(base.fecha + "T00:00:00Z"); dt.setUTCDate(dt.getUTCDate() + 1);
      plan.dias.splice(i + 1, 0, { fecha: dt.toISOString().slice(0, 10), ciudad: base.ciudad, titulo: "Nuevo día", dormir: base.dormir, traslado: "", notas: "", lugares: [] });
      sel = i + 1; guardar("Día agregado (revisá las fechas siguientes)"); render(true); break; }
    case "delDia": plan.dias.splice(i, 1); sel = Math.max(0, Math.min(sel, plan.dias.length - 1)); guardar("Día eliminado"); render(true); break;
  }
});
cont.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "adbkey") { try { localStorage.setItem("aerodatabox_key", el.value.trim()); } catch (err) {} toast(el.value.trim() ? "Clave guardada" : "Clave borrada"); render(false); return; }
  if (el.dataset.vf !== undefined) {
    const v = plan.vuelos[+el.dataset.v], f = el.dataset.vf;
    if (f === "comprado") v.comprado = el.value === "1";
    else if (f === "reserva") v.reserva = el.value.trim().toUpperCase();
    else if (f === "numero") { v.numero = el.value.trim().toUpperCase(); const pref = v.numero.slice(0, 2); const nom = { LA: "LATAM", FR: "Ryanair", VY: "Vueling", IB: "Iberia" }[pref]; if (nom) v.aerolinea = nom; }
    else v[f] = el.value;
    guardar(); render(false); return;
  }
  if (el.dataset.act === "mover") { const i = +el.dataset.i, j = +el.dataset.j, k = +el.value; if (k !== i) { const [l] = plan.dias[i].lugares.splice(j, 1); plan.dias[k].lugares.push(l); guardar("Lugar movido"); render(false); } return; }
  if (el.dataset.f !== undefined) {
    const i = +el.dataset.i, f = el.dataset.f;
    if (el.dataset.j !== undefined) plan.dias[i].lugares[+el.dataset.j][f] = el.value; else plan.dias[i][f] = el.value;
    guardar(); if (f === "ciudad" || f === "nombre" || f === "titulo" || f === "dormir") render(false);
  }
});
cont.addEventListener("input", e => { const el = e.target; if (el.dataset.f !== undefined && el.dataset.j === undefined) plan.dias[+el.dataset.i][el.dataset.f] = el.value; });
let bT;
cont.addEventListener("input", e => {
  const el = e.target; if (el.dataset.buscar === undefined) return;
  const i = +el.dataset.buscar, box = document.getElementById("sug" + i), q = el.value.trim();
  clearTimeout(bT); if (q.length < 3) { box.hidden = true; return; }
  bT = setTimeout(async () => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=es&q=${encodeURIComponent(q)}`);
      const res = await r.json();
      box.innerHTML = res.length ? res.map(x => `<button data-lat="${x.lat}" data-lng="${x.lon}" data-nombre="${esc(x.display_name.split(",")[0])}">${esc(x.display_name)}</button>`).join("") : `<button disabled>Sin resultados</button>`;
      box.hidden = false;
    } catch (err) { box.innerHTML = `<button disabled>No se pudo buscar</button>`; box.hidden = false; }
  }, 400);
});
cont.addEventListener("click", e => {
  const b = e.target.closest(".sug button[data-lat]"); if (!b) return;
  plan.dias[sel].lugares.push({ nombre: b.dataset.nombre, lat: +(+b.dataset.lat).toFixed(5), lng: +(+b.dataset.lng).toFixed(5) });
  guardar("Lugar agregado"); render(true);
});
document.addEventListener("click", e => { if (!e.target.closest(".buscar")) document.querySelectorAll(".sug").forEach(s => s.hidden = true); });

document.getElementById("verTodo").onclick = verTodo;
document.getElementById("contraer").onclick = () => { sel = -1; modoAgregar = false; document.getElementById("map").classList.remove("modo-agregar"); render(true); };
document.getElementById("exportar").onclick = () => {
  const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "itinerario-espana-2027.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById("importar").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const p = JSON.parse(await f.text()); if (!p.dias) throw new Error(); plan = p; sel = 0; guardar("Itinerario importado"); render(true); }
  catch (err) { toast("El archivo no es un itinerario válido"); }
  e.target.value = "";
};
document.getElementById("reset").onclick = () => {
  const b = document.getElementById("reset");
  if (b.dataset.confirm) { plan = JSON.parse(JSON.stringify(PLAN_BASE)); sel = 0; delete b.dataset.confirm; b.textContent = "Restablecer"; guardar("Plan base restablecido"); render(true); }
  else { b.dataset.confirm = "1"; b.textContent = "¿Seguro? Tocá de nuevo"; setTimeout(() => { delete b.dataset.confirm; b.textContent = "Restablecer"; }, 4000); }
};

plan = cargar();
render(false);
verTodo();
window.addEventListener("resize", () => map.invalidateSize());
setTimeout(() => { map.invalidateSize(); verTodo(); }, 300);
</script>
</body>
</html>
